[project]
name = "kmorey-skills"
version = "0.0.0"
description = "Personal agent skills"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7",
    "pytest>=9.0,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = [
    "planning-doc-preview/scripts",
    "tests",
]

[tool.ruff]
extend-exclude = [
    ".codex",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
